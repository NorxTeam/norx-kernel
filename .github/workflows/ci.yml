name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2

      - name: Install GRUB image tools
        run: sudo apt-get update && sudo apt-get install -y grub-common grub-efi-amd64-bin grub-efi-arm64-bin

      - name: Check formatting
        run: cargo fmt --check

      - name: Build x86_64 GRUB kernel
        run: cargo build --target x86_64-unknown-none

      - name: Build aarch64 GRUB kernel
        run: cargo build --target aarch64-unknown-none-softfloat

      - name: Lint x86_64 GRUB kernel
        run: cargo clippy --target x86_64-unknown-none -- -D warnings

      - name: Lint aarch64 GRUB kernel
        run: cargo clippy --target aarch64-unknown-none-softfloat -- -D warnings

      - name: Build x86_64 GRUB image
        run: MODE=build ./scripts/run.sh x86_64

      - name: Build aarch64 GRUB image
        run: MODE=build OBJCOPY=llvm-objcopy ./scripts/run.sh aarch64
