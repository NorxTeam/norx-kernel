name: ARM64 CI

on:
  push:
  pull_request:

jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - name: Install ARM QEMU and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64
      - name: Prepare ARM firmware names
        run: |
          set -euo pipefail
          share="$RUNNER_TEMP/norx-qemu-share"
          mkdir -p "$share"
          pick() {
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          code="$(pick /usr/share/AAVMF/AAVMF_CODE.fd /usr/share/edk2/aarch64/QEMU_CODE.fd /usr/share/qemu-efi-aarch64/QEMU_EFI.fd)"
          vars="$(pick /usr/share/AAVMF/AAVMF_VARS.fd /usr/share/edk2/aarch64/QEMU_VARS.fd /usr/share/qemu-efi-aarch64/QEMU_VARS.fd)"
          cp "$code" "$share/edk2-aarch64-code.fd"
          cp "$vars" "$share/edk2-arm-vars.fd"
      - name: Check formatting
        run: cargo fmt --check
      - name: Build native ARM64 UEFI kernel
        run: cargo build --locked --target aarch64-unknown-uefi
      - name: Strict native ARM64 lint
        run: cargo clippy --locked --target aarch64-unknown-uefi -- -D warnings
      - name: Bounded direct EFI serial smoke
        env:
          QEMU_SHARE: ${{ runner.temp }}/norx-qemu-share
        run: python3 scripts/arm-efi-smoke.py --log "$RUNNER_TEMP/norx-arm.serial.log" --timeout 45
      - name: Upload ARM smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-efi-smoke
          path: ${{ runner.temp }}/norx-arm.serial.log
          if-no-files-found: ignore
