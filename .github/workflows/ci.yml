name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2

      - name: Install GRUB, QEMU, and UEFI image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-common grub-efi-amd64-bin grub-efi-arm64-bin \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64

      - name: Prepare QEMU firmware names
        run: |
          set -euo pipefail
          share="$RUNNER_TEMP/norx-qemu-share"
          mkdir -p "$share"

          pick() {
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          x86_code="$(pick \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd)"
          x86_vars="$(pick \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd)"
          arm_code="$(pick \
            /usr/share/AAVMF/AAVMF_CODE.fd \
            /usr/share/edk2/aarch64/QEMU_CODE.fd \
            /usr/share/qemu-efi-aarch64/QEMU_EFI.fd)"
          arm_vars="$(pick \
            /usr/share/AAVMF/AAVMF_VARS.fd \
            /usr/share/edk2/aarch64/QEMU_VARS.fd \
            /usr/share/qemu-efi-aarch64/QEMU_VARS.fd)"

          cp "$x86_code" "$share/edk2-x86_64-code.fd"
          cp "$x86_vars" "$share/edk2-i386-vars.fd"
          cp "$arm_code" "$share/edk2-aarch64-code.fd"
          cp "$arm_vars" "$share/edk2-arm-vars.fd"

      - name: Check formatting
        run: cargo fmt --check

      - name: Build x86_64 GRUB kernel
        run: cargo build --target x86_64-unknown-none

      - name: Build aarch64 GRUB kernel
        run: cargo build --target aarch64-unknown-uefi

      - name: Lint x86_64 GRUB kernel
        run: cargo clippy --target x86_64-unknown-none -- -D warnings

      - name: Lint aarch64 GRUB kernel
        run: cargo clippy --target aarch64-unknown-uefi -- -D warnings

      - name: Build x86_64 GRUB image
        run: MODE=build ./scripts/run.sh x86_64

      - name: Build aarch64 GRUB image
        run: MODE=build ./scripts/run.sh aarch64

      - name: Prepare bounded persistence image
        run: python3 scripts/make-persistence-image.py "$RUNNER_TEMP/norx-persistence.img"

      - name: QEMU smoke tests
        run: |
          set -euo pipefail

          smoke() {
            arch="$1"
            marker="$2"
            display="$3"
            early_uart_marker="$4"
            vfs_marker="$5"
            log="$RUNNER_TEMP/norx-$arch.serial.log"
            stable_log="$RUNNER_TEMP/norx-$arch.stable.log"
            screenshot="$RUNNER_TEMP/norx-$arch.ppm"
            vars="$RUNNER_TEMP/norx-$arch-vars.fd"
            qmp="$RUNNER_TEMP/norx-$arch.qmp"

            rm -f "$log" "$stable_log" "$screenshot" "$qmp"
            env QEMU_SHARE="$RUNNER_TEMP/norx-qemu-share" \
              QEMU_DISPLAY="$display" QEMU_MONITOR="$qmp" \
              QEMU_VARS="$vars" MODE=run \
              ./scripts/run.sh "$arch" >"$log" 2>&1 &
            qemu_pid=$!

            deadline=$((SECONDS + 45))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if grep -F "$marker" "$log" >/dev/null 2>&1; then
                break
              fi
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                echo "QEMU $arch exited before the smoke marker"
                cat "$log"
                return 1
              fi
              sleep 1
            done
            grep -F "$marker" "$log"
            grep -F "$early_uart_marker" "$log"
            grep -F "$vfs_marker" "$log"

            python3 - "$qmp" "$screenshot" <<'PY'
          import json
          import socket
          import sys

          qmp_path, screenshot_path = sys.argv[1:]
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(10)
          sock.connect(qmp_path)
          sock.recv(4096)

          def command(name, arguments=None):
              request = {"execute": name}
              if arguments is not None:
                  request["arguments"] = arguments
              sock.sendall((json.dumps(request) + "\r\n").encode())
              response = b""
              while b'"return"' not in response and b'"error"' not in response:
                  response += sock.recv(4096)
              if b'"error"' in response:
                  raise RuntimeError(response.decode(errors="replace"))

          command("qmp_capabilities")
          command("screendump", {"filename": screenshot_path})
          sock.close()
          PY

            python3 - "$log" "$stable_log" <<'PY'
          import re
          import sys

          source, destination = sys.argv[1:]
          ansi = re.compile(r"\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\a]*(?:\a|\x1b\\))")
          text = open(source, encoding="utf-8", errors="replace").read()
          lines = []
          for line in ansi.sub("", text).replace("\r", "\n").splitlines():
              line = line.replace("\b", "").strip()
              if line and (not lines or line != lines[-1]):
                  lines.append(line)
          open(destination, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

            grep -F "$marker" "$stable_log"
            grep -F "$early_uart_marker" "$stable_log"
            grep -F "$vfs_marker" "$stable_log"
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }

          smoke x86_64 "x86_64 lazy page faults allocate, zero, and map through the direct map" "vnc=127.0.0.1:0" "NORX_EARLY_UART_READY v=1 backend=ns16550 poll-limit=4096" "ramfs /hello.txt readback passed"
          smoke aarch64 "persistent warm-reboot status committed" "vnc=127.0.0.1:1" "NORX_EARLY_UART_READY v=1 backend=pl011 poll-limit=4096" "ramfs /hello.txt readback passed"
          grep -F "NORX_SERIAL_DEBUGGER_READY v=1" "$RUNNER_TEMP/norx-aarch64.stable.log"

      - name: QEMU x86_64 bounded persistence smoke
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/norx-persistence.img"

          boot() {
            log="$1"
            vars="$2"
            rm -f "$log" "$vars"
            env QEMU_SHARE="$RUNNER_TEMP/norx-qemu-share" \
              QEMU_DISPLAY=none QEMU_SERIAL="file:$log" \
              QEMU_VARS="$vars" QEMU_BLOCK_IMAGE="$image" MODE=run \
              ./scripts/run.sh x86_64 >"$log.stdout" 2>&1 &
            qemu_pid=$!
            deadline=$((SECONDS + 45))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if grep -F "NORX_FAT32_PERSIST_READBACK_OK v=1" "$log" >/dev/null 2>&1; then
                break
              fi
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                cat "$log.stdout" 2>/dev/null || true
                cat "$log" 2>/dev/null || true
                return 1
              fi
              sleep 1
            done
            grep -F "NORX_FAT32_PERSIST_WRITE_OK v=1" "$log"
            grep -F "NORX_FAT32_PERSIST_READBACK_OK v=1" "$log"
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }

          first="$RUNNER_TEMP/norx-persistence-1.serial.log"
          second="$RUNNER_TEMP/norx-persistence-2.serial.log"
          boot "$first" "$RUNNER_TEMP/norx-persistence-1-vars.fd"
          boot "$second" "$RUNNER_TEMP/norx-persistence-2-vars.fd"
          first_sequence="$(grep -o 'NORX_FAT32_PERSIST_WRITE_OK v=1 previous=[0-9]* sequence=[0-9]*' "$first" | tail -1 | sed -E 's/.*sequence=([0-9]+).*/\1/')"
          second_previous="$(grep -o 'NORX_FAT32_PERSIST_WRITE_OK v=1 previous=[0-9]* sequence=[0-9]*' "$second" | tail -1 | sed -E 's/.*previous=([0-9]+).*/\1/')"
          second_sequence="$(grep -o 'NORX_FAT32_PERSIST_WRITE_OK v=1 previous=[0-9]* sequence=[0-9]*' "$second" | tail -1 | sed -E 's/.*sequence=([0-9]+).*/\1/')"
          test "$second_previous" = "$first_sequence"
          test "$second_sequence" = "$((first_sequence + 1))"

      - name: Upload QEMU smoke logs and framebuffer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-artifacts
          path: |
            ${{ runner.temp }}/norx-*.serial.log
            ${{ runner.temp }}/norx-*.stable.log
            ${{ runner.temp }}/norx-*.ppm
          if-no-files-found: ignore
