set timeout=0
set default=0
insmod part_msdos
insmod fat
insmod chain
insmod efi_gop
insmod all_video
insmod gfxterm
set root=(hd0,msdos1)
set gfxmode=1200x800x32,1024x768x32,800x600x32,auto
set gfxpayload=1200x800x32

terminal_output gfxterm

menuentry "Norx aarch64" {
    devicetree /boot/norx.dtb
    chainloader /boot/norx.efi
    boot
}
